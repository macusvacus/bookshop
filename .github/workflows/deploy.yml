name:Debug FTP connection env:
    FTP_SERVER: ${{ secrets.FTP_SERVER }}
    FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
    FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
  run: |
    sudo apt-get update && sudo apt-get install -y lftp
    echo "Listing remote home:"
    lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "pwd; ls -la; exit"
    echo "Trying to create test dir and list it:"
    lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "mkdir test-deploy-dir || true; cd test-deploy-dir || true; pwd; ls -la; rmdir test-deploy-dir || true; exit"
